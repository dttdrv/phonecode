name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: report-backend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Install report backend toolchain
        working-directory: report-backend
        run: npm ci
      - name: Test report backend in Node and workerd
        working-directory: report-backend
        run: npm test
      - name: Validate report backend D1 migration
        working-directory: report-backend
        run: npm run check:migrations
      - name: Validate report backend deployment bundle
        working-directory: report-backend
        run: npm run check:deploy
      - name: Test and lint
        run: ./gradlew --no-daemon test lintDebug :app:verifyLegalInventory :app:verifyPrototypeRuntimeBoundary
      - name: Build optimized sideload artifact
        run: ./gradlew --no-daemon :app:verifySideloadMisulApk
      - name: Verify Play release gate
        shell: bash
        run: |
          set +e
          output=$(./gradlew --no-daemon :app:verifyPlayRelease 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if (( status == 0 )); then
            echo "Play release gate unexpectedly passed before the release evidence was complete"
            exit 1
          fi
          if grep -Fq "Google Play release blocked:" <<<"$output"; then
            grep -F "implement authenticated host-project workspace transport for the isolated VM runtime" <<<"$output"
          elif grep -Fq "native-runtime/.downloads" <<<"$output" &&
            grep -Fq "which doesn't exist" <<<"$output"; then
            echo "Play release gate correctly blocked on the absent authenticated offline source cache"
          else
            echo "Play release gate failed for an unexpected reason"
            exit 1
          fi
      - name: Verify Play execution boundary
        shell: bash
        run: |
          if grep -RInE --include='*.kt' --include='*.java' \
            'dalvik\.system\.|DexClassLoader|InMemoryDexClassLoader|PathClassLoader|DexFile|URLClassLoader|PackageInstaller|REQUEST_INSTALL_PACKAGES|ACTION_INSTALL_PACKAGE|application/vnd\.android\.package-archive|/system/bin/(sh|toybox)' \
            app/src/main agent/src/main tools/src/main; then
            echo "Forbidden Android runtime loader or host shell fallback found"
            exit 1
          fi
      - name: Verify 16 KB compatibility
        shell: bash
        run: |
          ./native-runtime/audit-apk-native-libs.sh app/build/outputs/apk/sideload/app-sideload.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/sideload/app-sideload.apk
